<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LinguaBridge - AI Language Translator | CodeAlpha</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

<div class="main-container">
    <!-- Top Header -->
    <div class="header">
        <div class="logo">🌐 Lingua<span>Bridge</span></div>
        <div class="badge">AI POWERED</div>
    </div>

    <div class="card">
        <h2>Language Translator</h2>
        <p class="subtitle">Translate in 8+ Languages Instantly with AI</p>

        <!-- Input Box -->
        <div class="label-row">
            <span>Your Text</span>
            <span id="charCount">0 / 500</span>
        </div>
        <textarea id="inputText" placeholder="Type here... e.g. Hello, how are you?" maxlength="500"></textarea>

        <!-- Language Selection -->
        <div class="langs">
            <div class="lang-box">
                <label>FROM</label>
                <select id="fromLang">
                    <option value="en">🇺🇸 English</option>
                    <option value="ur">🇵🇰 Urdu</option>
                    <option value="hi">🇮🇳 Hindi</option>
                    <option value="ar">🇸🇦 Arabic</option>
                    <option value="fr">🇫🇷 French</option>
                    <option value="es">🇪🇸 Spanish</option>
                    <option value="de">🇩🇪 German</option>
                    <option value="zh">🇨🇳 Chinese</option>
                </select>
            </div>

            <button class="swap-btn" onclick="swapLang()" title="Swap Languages">⇄</button>

            <div class="lang-box">
                <label>TO</label>
                <select id="toLang">
                    <option value="ur">🇵🇰 Urdu</option>
                    <option value="en">🇺🇸 English</option>
                    <option value="hi">🇮🇳 Hindi</option>
                    <option value="ar">🇸🇦 Arabic</option>
                    <option value="fr">🇫🇷 French</option>
                    <option value="es">🇪🇸 Spanish</option>
                </select>
            </div>
        </div>

        <button class="translate-btn" onclick="translateText()">✨ Translate Now</button>

        <!-- Output -->
        <div class="label-row">
            <span>Translation</span>
            <span class="auto-tag">Auto Detected</span>
        </div>
        <div class="output" id="outputText">Your translated text will appear here...</div>

        <div class="small-btns">
            <button class="copy-btn" onclick="copyText()">📋 Copy Text</button>
            <button class="speak-btn" onclick="speakText()">🔊 Listen</button>
            <button class="clear-btn" onclick="clearAll()">🗑️ Clear</button>
        </div>
    </div>

    <p class="footer">Made with ❤️ by <b>Muhammad Yasir</b> | CodeAlpha AI Internship - Task 1</p>
</div>

<script src="script.js"></script>
</body>
</html>
